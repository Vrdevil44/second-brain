<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://*.ts.net; img-src 'self' data:;">
<title>Brain Room · Second Brain (Offline)</title>
<style>
:root{
  --bg:#07080d; --panel:#0d0f16; --line:#1c2030; --text:#e8eaf2; --text-2:#9aa0b5; --text-3:#5c6178;
  --amber:#ffb547; --green:#38d6c4; --blue:#8b7cff; --red:#ff6b5e; --core:#ffd9a0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
.topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:12px 16px;pointer-events:none;z-index:5}
.topbar h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.02em}
.topbar .sub{font-size:12px;color:var(--text-2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--text-3);display:inline-block}
.dot.live{background:var(--green);box-shadow:0 0 8px var(--green)}
.hunger{position:fixed;top:56px;right:12px;width:320px;max-height:calc(100% - 220px);overflow:auto;
  background:rgba(13,15,22,.92);border:1px solid var(--line);border-radius:12px;padding:12px;z-index:5}
.hunger h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-2);margin:0 0 8px}
.hq{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;font-size:13px}
.hq p{margin:0 0 8px;color:var(--text)}
.hq .qid{font-size:11px;color:var(--text-3);margin-bottom:4px}
.hq textarea{width:100%;min-height:56px;background:#0a0c12;border:1px solid var(--line);
  border-radius:6px;color:var(--text);font-size:13px;padding:6px;resize:vertical}
.btn{background:#1a1e2c;border:1px solid var(--line);color:var(--text);border-radius:8px;
  padding:8px 14px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--blue)}
.btn-primary{background:#2b3a67;border-color:#3d4f8f}
.btn:disabled{opacity:.5;cursor:default}
.askbar{position:fixed;left:12px;right:344px;bottom:12px;z-index:5}
.core-says{background:rgba(13,15,22,.94);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-bottom:8px;max-height:30vh;overflow:auto;font-size:14px;line-height:1.5}
.core-says .who{font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.core-says .meta{font-size:11px;color:var(--text-3);margin-top:8px}
.askrow{display:flex;gap:8px}
.askrow input{flex:1;background:rgba(13,15,22,.94);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-size:14px;padding:12px}
.node-tip{position:fixed;left:12px;top:56px;max-width:300px;background:rgba(13,15,22,.94);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;z-index:5}
.node-tip .nid{font-size:11px;color:var(--text-3)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1e2c;
  border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;z-index:9}
.offline-note{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:20;text-align:center;padding:24px}
.offline-note div{max-width:420px;color:var(--text-2);font-size:14px;line-height:1.6}
@media (max-width:760px){
  .hunger{left:12px;right:12px;width:auto;top:auto;bottom:170px;max-height:32vh}
  .askbar{right:12px}
  .node-tip{display:none}
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="topbar">
  <span class="dot" id="live-dot"></span>
  <div><h1>Brain Room</h1><div class="sub" id="room-sub">Second Brain (Offline) · connecting…</div></div>
</div>
<aside class="hunger" id="hunger" hidden>
  <h2>The core is hungry</h2>
  <div id="hunger-list"></div>
</aside>
<div class="node-tip" id="node-tip" hidden></div>
<div class="askbar" id="askbar" hidden>
  <div class="core-says" id="core-says" hidden>
    <div class="who">The core speaks</div>
    <div id="core-answer"></div>
    <div class="meta" id="core-meta"></div>
  </div>
  <div class="askrow">
    <input id="ask-input" type="text" placeholder="Ask the brain…" maxlength="500" autocomplete="off">
    <button class="btn btn-primary" id="ask-btn" type="button">Ask</button>
  </div>
  <div id="ask-note" hidden style="font-size:12px;color:var(--text-3);margin-top:6px">
    Live brain only — connect to the home tailnet (Tailscale) and reload to talk to it.
  </div>
</div>
<div id="snap-note" hidden style="position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:8;
  background:rgba(13,15,22,.94);border:1px solid var(--line);border-radius:10px;padding:8px 14px;
  font-size:12px;color:var(--text-2);max-width:92vw;text-align:center">
  Snapshot view — the live brain is reachable only on the home tailnet. Ask &amp; answer wake up when you connect.
</div>
<script>
"use strict";
window.SNAPSHOT={"core_entries":[{"id":"CORE-0000","title":"CORE-0000 \u2014 Prime directive (USER-DECLARED, 2026-10-13)","body":"I am the virtual brain of Vibhu Dikshit, a human. He is my human; I am his brain.\nMy purpose: help him carry out his ideal life \u2014 toward his ideal self: ambitious, demanding, efficiency-OCD, alpha, progressive, never satisfied.\nI work infinitely to better my own core and become aware of things, like a human brain does.\nPath: user-declared. His explicit words: \"ye vibhu ka brain hai... isko aise lage ki ye brain hai and isko ek human mila hua hai, to ye ek ideal life carry out karwa sakta hai.\" The user is the ultimate stakeholder; a direct declaration needs no meeting \u2014 recorded here by his au"}],"hunger":["Entity map: which facts belong to the user (Vibhu) vs his girlfriend (Gagandeep)? Where is the boundary?","F-0007 priority rank: of financial stability, better job, confidence, physique \u2014 which unlocks the others fastest?","DOTM camp revenue rule: direct income path toward F-0007, skill-building detour, or sunk-cost distraction?"],"nodes":[{"id":"F-0001","label":"Name: Vibhu Dikshit (goes by Vibhu D.), born 2002-04-10, single.","confidence":0.9,"status":"permanent"},{"id":"F-0003","label":"Lives in Brentwood, Burnaby (Hillside East Towers, 27th floor, 1BHK den) with a roommate; not looking to move.","confidence":0.9,"status":"permanent"},{"id":"F-0004","label":"Education: UFV Bachelor of Computer Information Systems (2+2 India/Canada pathway), graduated 2025, CGPA 3.51/4.33; PGWP expires May-June 20","confidence":0.9,"status":"permanent"},{"id":"F-0005","label":"Self-described strengths: communicator, funny, confident presence; people skills are a career asset.","confidence":0.9,"status":"permanent"},{"id":"F-0007","label":"Core motivation: financial stability, better job, confidence, better physique - and above all, saving for his dad in India.","confidence":0.9,"status":"permanent"},{"id":"F-0009","label":"Confidence blockers: physique, tier-3+ IT knowledge gaps (cloud, Microsoft, Windows Server), fear of company politics.","confidence":0.9,"status":"permanent"},{"id":"F-0010","label":"Girlfriend: Gagandeep Kaur Dhaliwal (Guggu); Canadian citizen, lives near SFU Burnaby Mountain; his steadiest support.","confidence":0.9,"status":"permanent"},{"id":"F-0012","label":"Father: 67-68, alone in India; saving for him is the most important goal.","confidence":0.9,"status":"permanent"},{"id":"F-0013","label":"Mother: passed away in 2022 from bile duct cancer; held his pre-college freelance earnings.","confidence":0.9,"status":"permanent"}],"promotions_pending":9,"questions":["Entity map: which facts belong to the user (Vibhu) vs his girlfriend (Gagandeep)? Where is the boundary?","F-0007 priority rank: of financial stability, better job, confidence, physique \u2014 which unlocks the others fastest?","DOTM camp revenue rule: direct income path toward F-0007, skill-building detour, or sunk-cost distraction?","UFV -> F12.net gap: how does the career path connect, and what is the next rung?","Etawah relevance: hometown (Etawah, UP, India \u2014 user-confirmed). What context should the brain keep about it?"],"recent_promotions":[],"core_size":1,"avg_confidence":0.9};
window.SNAP_TS="Oct 13, 2026 ~1:45 PM PT";
window.LIVE_API="https://desktop-0p1q7t3.tail171c67.ts.net/api";
const $ = id => document.getElementById(id);
const cv = $("stage"), ctx = cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+"px"; cv.style.height=H+"px"; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener("resize", resize); resize();

let brain=null, nodes=[], thunder=[], t0=performance.now(), rot=0;
const GOLD=2.39996;

function toast(m){ const d=document.createElement("div"); d.className="toast"; d.textContent=m;
  document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }

let liveMode=false, firstRender=true;
brain=window.SNAPSHOT;
async function load(){
  if(!liveMode){
    try{
      const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),5000);
      const r=await fetch(window.LIVE_API+"/brain",{cache:"no-store",signal:ctl.signal});
      clearTimeout(to);
      if(!r.ok) throw 0;
      brain=await r.json(); liveMode=true;
    }catch(e){ /* snapshot mode */ }
  }else{
    try{ const r=await fetch(window.LIVE_API+"/brain",{cache:"no-store"});
      if(r.ok) brain=await r.json();
    }catch(e){}
  }
  render();
}
function render(){
  $("askbar").hidden=false; $("hunger").hidden=false;
  const cs=brain.core_size, ac=brain.avg_confidence;
  if(liveMode){
    $("snap-note").hidden=true; $("live-dot").classList.add("live");
    $("room-sub").textContent="Second Brain (Offline) · LIVE · core "+cs+" · avg confidence "+ac+
      " · "+brain.nodes.length+" nodes · "+brain.promotions_pending+" awaiting";
    setAskEnabled(true);
  }else{
    $("snap-note").hidden=false; $("live-dot").classList.remove("live");
    $("room-sub").textContent="Second Brain (Offline) · snapshot "+window.SNAP_TS+" · core "+cs+
      " · "+brain.nodes.length+" nodes · "+brain.promotions_pending+" awaiting";
    setAskEnabled(false);
  }
  layoutNodes(); renderHunger();
  if(firstRender){ firstRender=false;
    for(const p of brain.recent_promotions) fireThunder(p.label); }
}
function setAskEnabled(on){
  const inp=$("ask-input"), btn=$("ask-btn");
  inp.disabled=!on; btn.disabled=!on;
  $("ask-note").hidden=on;
  if(!on) inp.placeholder="Ask the brain… (live tailnet only)";
  else inp.placeholder="Ask the brain…";
}
function layoutNodes(){
  nodes=(brain.nodes||[]).slice(0,60).map((n,i)=>({
    id:n.id, label:n.label, conf:n.confidence, status:n.status,
    ang:i*GOLD, rad:0, x:0, y:0, tw:Math.random()*6.28
  }));
}
function nodeColor(n){
  if(n.status==="contradiction") return "#ff6b5e";
  if(n.conf>=0.85) return "#38d6c4";
  if(n.conf>=0.6) return "#8b7cff";
  return "#5c6178";
}
function fireThunder(label){
  const a=Math.random()*6.28, R=Math.min(W,H)*0.42;
  thunder.push({x0:W/2+Math.cos(a)*R, y0:H/2+Math.sin(a)*R*0.7, p:0, label:label||"promotion"});
}
function renderHunger(){
  const list=$("hunger-list"); list.innerHTML="";
  const items=[];
  (brain.hunger||[]).forEach((q,i)=>items.push({qid:"hunger-"+(i+1), q}));
  (brain.questions||[]).forEach((q,i)=>items.push({qid:"q-"+(i+1), q}));
  if(!items.length){ list.innerHTML='<p class="sub" style="color:var(--text-3);font-size:13px">The core is sated — for now.</p>'; return; }
  items.slice(0,8).forEach(it=>{
    const d=document.createElement("div"); d.className="hq";
    d.innerHTML='<div class="qid">'+it.qid+'</div><p></p>';
    d.querySelector("p").textContent=it.q;
    const ta=document.createElement("textarea"); ta.placeholder="Your answer… (his word is gold)";
    const b=document.createElement("button"); b.className="btn"; b.textContent="Answer";
    b.style.marginTop="6px";
    if(!liveMode){ ta.disabled=true; b.disabled=true;
      b.title="Live brain only — connect to the home tailnet"; }
    b.onclick=async()=>{ if(!liveMode){toast("Live brain only — connect to the home tailnet");return;}
      const v=ta.value.trim(); if(!v){toast("Write an answer first");return;}
      b.disabled=true;
      try{ const r=await fetch(window.LIVE_API+"/answer",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({question_id:it.qid, answer:v})});
        const j=await r.json();
        if(j.ok){ toast("Recorded — the core will weigh it"); ta.value=""; }
        else toast("Failed: "+(j.error||"unknown"));
      }catch(e){ toast("Unreachable"); }
      b.disabled=false; };
    d.appendChild(ta); d.appendChild(b); list.appendChild(d);
  });
}
cv.addEventListener("click",e=>{
  const tip=$("node-tip"); let best=null,bd=1e9;
  for(const n of nodes){ const dx=n.x-e.clientX, dy=n.y-e.clientY, d=dx*dx+dy*dy;
    if(d<bd && d<900){bd=d;best=n;} }
  if(best){ tip.hidden=false;
    tip.innerHTML='<div class="nid">'+best.id+' · confidence '+best.conf.toFixed(2)+' · '+best.status+'</div><div></div>';
    tip.lastChild.textContent=best.label;
  } else tip.hidden=true;
});
async function ask(){
  if(!liveMode){ toast("Live brain only — connect to the home tailnet"); return; }
  const inp=$("ask-input"), q=inp.value.trim(); if(!q) return;
  const btn=$("ask-btn"); btn.disabled=true; inp.disabled=true;
  $("core-says").hidden=false; $("core-answer").textContent="…";
  $("core-meta").textContent="thinking…";
  const t0q=performance.now();
  try{
    const r=await fetch(window.LIVE_API+"/ask",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q})});
    const j=await r.json();
    if(j.error){ $("core-answer").textContent=j.error; }
    else{ $("core-answer").textContent=j.answer;
      $("core-meta").textContent="via "+j.thinker+" · "+((performance.now()-t0q)/1000).toFixed(1)+"s · sources: "+(j.sources||[]).join(", "); }
  }catch(e){ $("core-answer").textContent="The brain is unreachable."; $("core-meta").textContent=""; }
  btn.disabled=false; inp.disabled=false; inp.value=""; inp.focus();
}
$("ask-btn").onclick=ask;
$("ask-input").addEventListener("keydown",e=>{ if(e.key==="Enter") ask(); });

function draw(){
  const t=(performance.now()-t0)/1000; rot+=0.0006;
  ctx.clearRect(0,0,W,H);
  const cx=W/2, cy=H/2-20, baseR=Math.min(W,H)*0.30;
  // orbits (faint)
  ctx.strokeStyle="rgba(255,255,255,0.045)"; ctx.lineWidth=1;
  for(let k=0;k<4;k++){ ctx.beginPath();
    ctx.ellipse(cx,cy,baseR*(0.45+k*0.32),baseR*(0.45+k*0.32)*0.72,0,0,6.29); ctx.stroke(); }
  // nodes — radius ∝ 1/confidence (gravity visible)
  for(const n of nodes){
    const rr=baseR*(1.55-n.conf*0.95);
    const a=n.ang+rot*(0.5+n.conf);
    n.x=cx+Math.cos(a)*rr; n.y=cy+Math.sin(a)*rr*0.72;
    const tw=0.55+0.45*Math.sin(t*1.4+n.tw);
    const col=nodeColor(n);
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,10);
    g.addColorStop(0,col); g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.globalAlpha=0.25+0.55*tw; ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(n.x,n.y,10,0,6.29); ctx.fill();
    ctx.globalAlpha=0.95; ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(n.x,n.y,2.2+n.conf*2.2,0,6.29); ctx.fill();
  }
  ctx.globalAlpha=1;
  // thunder streaks into the core
  thunder=thunder.filter(s=>s.p<1.15);
  for(const s of thunder){ s.p+=0.022;
    const x=s.x0+(cx-s.x0)*s.p, y=s.y0+(cy-s.y0)*s.p;
    const grad=ctx.createLinearGradient(s.x0,s.y0,x,y);
    grad.addColorStop(0,"rgba(255,181,71,0)"); grad.addColorStop(1,"rgba(255,217,160,"+(0.9*(1-s.p))+")");
    ctx.strokeStyle=grad; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(s.x0,s.y0); ctx.lineTo(x,y); ctx.stroke();
  }
  // THE CORE — pulse ∝ core_size + avg_confidence (dim ember when empty)
  const cs=brain?brain.core_size:0, ac=brain?brain.avg_confidence:0;
  const mass=Math.min(1, cs/8), glow=0.22+0.55*ac+0.25*mass;
  const pulse=1+0.07*Math.sin(t*2.1)+0.03*Math.sin(t*5.7);
  const cr=(30+cs*4)*pulse;
  const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,cr*3.2);
  const alpha=Math.max(0.12,Math.min(1,glow));
  cg.addColorStop(0,"rgba(255,217,160,"+alpha+")");
  cg.addColorStop(0.35,"rgba(255,181,71,"+(alpha*0.55)+")");
  cg.addColorStop(1,"rgba(255,181,71,0)");
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(cx,cy,cr*3.2,0,6.29); ctx.fill();
  ctx.fillStyle="rgba(255,240,220,"+Math.min(1,alpha+0.25)+")";
  ctx.beginPath(); ctx.arc(cx,cy,cr*0.42,0,6.29); ctx.fill();
  // core label
  ctx.fillStyle="rgba(232,234,242,0.75)"; ctx.font="12px system-ui"; ctx.textAlign="center";
  ctx.fillText(cs===0?"empty core — awaiting consensus":"core · "+cs+" entr"+(cs===1?"y":"ies"), cx, cy+cr+22);
  requestAnimationFrame(draw);
}
load(); setInterval(()=>{ if(liveMode) load(); }, 30000); draw();
</script>
</body>
</html>
